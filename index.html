<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>GLB & ZIP Texture Viewer</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #ui { position: absolute; top: 10px; left: 10px; z-index: 10; background: rgba(255,255,255,0.9); padding: 10px; border-radius: 8px; }
    </style>
</head>
<body>
    <div id="ui">
        <h3>GLB + ZIP テクスチャ読み込み</h3>
        <input type="file" id="fileInput" accept=".zip">
    </div>

    <!-- Three.js および関連ライブラリ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // シーン・カメラ・レンダラーの初期化
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xefefef);
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1, 3);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);

        // ライティング
        const ambientLight = new THREE.AmbientLight(0xffffff, 1);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        // ファイル入力の処理
        document.getElementById('fileInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const zip = new JSZip();
            const zipContent = await zip.loadAsync(file);

            let glbBlobUrl = null;
            let textureBlobUrl = null;

            // ZIP内のファイルを走査
            for (const [relativePath, zipEntry] of Object.entries(zipContent.files)) {
                if (zipEntry.dir) continue;

                if (relativePath.endsWith('.glb') || relativePath.endsWith('.gltf')) {
                    const arrayBuffer = await zipEntry.async('arraybuffer');
                    const blob = new Blob([arrayBuffer]);
                    glbBlobUrl = URL.createObjectURL(blob);
                } else if (/\.(png|jpg|jpeg)$/i.test(relativePath)) {
                    // 1枚にまとめられたテクスチャ画像など
                    const arrayBuffer = await zipEntry.async('arraybuffer');
                    const blob = new Blob([arrayBuffer]);
                    textureBlobUrl = URL.createObjectURL(blob);
                }
            }

            // GLBの読み込みとテクスチャの適用
            if (glbBlobUrl) {
                const loader = new THREE.GLTFLoader();
                loader.load(glbBlobUrl, (gltf) => {
                    scene.add(gltf.scene);

                    // もしテクスチャが別ファイル（アトラス等）としてZIP内にある場合、手動でマテリアルに適用
                    if (textureBlobUrl) {
                        const textureLoader = new THREE.TextureLoader();
                        textureLoader.load(textureBlobUrl, (texture) => {
                            texture.flipY = false; // GLB形式に合わせたUV反転設定
                            gltf.scene.traverse((child) => {
                                if (child.isMesh) {
                                    if (child.material) {
                                        child.material.map = texture;
                                        child.material.needsUpdate = true;
                                    }
                                }
                            });
                        });
                    }
                });
            }
        });

        // レンダリングループ
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
